[platformio]
src_dir = src

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1


; HIL reads real 32-byte MNC1/MNT1 packets via serial and returns
; hypothetical motor commands. All physical motor commands are refused.
[env:esp32s3-hil]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -D MIDNIGHT_HIL_SIMULATION=1
